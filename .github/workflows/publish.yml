name: Publish to npm

# Publishes @runonflux/react-native-step-indicator from CI with npm trusted
# publishing (OIDC) and a signed provenance attestation, so consumers can
# check that a given npm version was built from this repository at a given
# tag (`npm audit signatures`). There is no long-lived npm token anywhere:
# npm exchanges this job's short-lived GitHub OIDC token for a publish
# credential, and only for the repo + workflow file + environment configured
# as the package's trusted publisher on npmjs.com.
#
# Release: bump package.json "version", merge to master, then push tag vX.Y.Z.
on:
  push:
    tags: ['v*']

# Nothing by default; the job below asks for exactly what it needs.
permissions: {}

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: verify, test, build, publish (provenance)
    runs-on: ubuntu-latest
    # Required reviewers + "selected tags: v*" are configured on this
    # environment in the repo settings; the npm trusted publisher is bound to it.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing + provenance
    steps:
      # Third-party actions are pinned to full commit SHAs (tags can be moved).
      # No dependency caches in this job: a release must not restore state
      # written by other workflow runs (cache poisoning).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # No registry-url: npm gets its publish token from OIDC (trusted
          # publishing), and the .npmrc setup-node would write holds an unset
          # ${NODE_AUTH_TOKEN} that yarn v1 refuses to load.

      # Trusted publishing needs npm >= 11.5.1. Pinned exactly.
      - name: Pin npm
        run: npm install -g --ignore-scripts npm@11.19.1 && npm --version

      - name: Tag must equal package.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v${version}" ]; then
            echo "::error::tag ${TAG} does not match package.json version ${version}"
            exit 1
          fi

      # Lifecycle scripts of dependencies never run on the release runner
      # (this also keeps husky from installing git hooks). The example app's
      # own dependencies (example/, an Expo app) are not installed.
      - run: yarn install --frozen-lockfile --ignore-scripts
      # eslint (@react-native-community config + prettier), deliberately with
      # no exclusions. IT DOES NOT PASS ON THE CURRENT TREE: 10 prettier
      # errors in src/index.tsx and example/src/data.ts (the fork's edits were
      # formatted with a newer prettier than the locked 2.0.5). Publishing
      # stays blocked until they are fixed (`yarn lint --fix`).
      - name: Lint (blocks publishing while it fails)
        run: yarn lint
      # tsc --noEmit over the repo, deliberately unchanged.
      # IT DOES NOT PASS ON THE CURRENT TREE (4 errors): 3 in example/, whose
      # dependencies are not installed here, and 1 in src/__tests__ because
      # tsconfig.json sets "types": [], which hides jest's globals. src/
      # itself type-checks clean. Publishing stays blocked until tsconfig.json
      # scopes the check to the library (e.g. excludes example/) and the test
      # file can see jest's types.
      - name: Type-check (blocks publishing while it fails)
        run: yarn typescript
      # jest; the suite is currently a single it.todo placeholder.
      - run: yarn test --ci
      # --ignore-scripts skipped `prepare` (bob build), so build lib/
      # (commonjs, module, typescript) explicitly. bob's typescript target
      # prints tsc errors without failing, hence the separate type-check.
      - name: Build lib/ (bob)
        run: yarn prepare

      # --ignore-scripts: publish exactly the tarball of what was built and
      # tested above (prepare would only rebuild the same lib/).
      - name: Stage publish with provenance (maintainer approves on npm)
        # Staged publishing: CI uploads the version (with provenance) but it is
        # NOT live until a maintainer approves it with 2FA on npmjs.com or via
        # `npm stage approve <stage-id>`. The npm trusted publisher is configured
        # without 'Allow npm publish', so a direct `npm publish` would be refused.
        run: npm stage publish --provenance --access public --ignore-scripts
